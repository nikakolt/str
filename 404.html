<script>
  function disintegrate(element) {
    const rect = element.getBoundingClientRect();
    const parent = element.parentNode;
    const pieces = 40; 

    for (let i = 0; i < pieces; i++) {
      const piece = document.createElement('div');
      piece.style.position = 'absolute';
      piece.style.width = '8px';
      piece.style.height = '8px';
      piece.style.background = `url(${element.src})`;
      piece.style.backgroundSize = `${element.offsetWidth}px ${element.offsetHeight}px`;
      piece.style.backgroundPosition = `${Math.random() * -element.offsetWidth}px ${Math.random() * -element.offsetHeight}px`;
      piece.style.left = `${rect.left + Math.random() * rect.width}px`;
      piece.style.top = `${rect.top + Math.random() * rect.height}px`;
      piece.style.opacity = '1';
      piece.style.zIndex = '1000';
      document.body.appendChild(piece);

      gsap.to(piece, {
        duration: 1.2 + Math.random(),
        x: (Math.random() - 0.5) * 300,
        y: (Math.random() - 0.5) * 300,
        rotation: Math.random() * 360,
        scale: Math.random() * 0.5 + 0.3,
        opacity: 0,
        ease: "power2.out",
        onComplete: () => piece.remove()
      });
    }

    gsap.to(element, {
      duration: 0.3,
      opacity: 0,
      scale: 0.8,
      onComplete: () => element.style.display = 'none'
    });
  }


  const flowers = document.querySelectorAll('.cvetcvet, .cvetcvet1, .cvetcvet2, .cvetcvet3, .cvetcvet4, .cvetcvet5, .cvetcvet6, .cvetcvet7, .cvetcvet8, .cvetcvet9, .cvetcvet10');
  flowers.forEach(flower => {
    flower.addEventListener('mouseenter', () => {
      if (!flower.classList.contains('disintegrated')) {
        disintegrate(flower);
        flower.classList.add('disintegrated');
      }
    });
  });
</script>

<script>

document.addEventListener('DOMContentLoaded', function() {
const burger = document.getElementById('burgerBtn');
const menu = document.querySelector('.list-container');
const body = document.body;
        
      
if (burger && menu) {

burger.addEventListener('click', function(e) {
e.stopPropagation();
menu.classList.toggle('active');
burger.classList.toggle('active');
body.classList.toggle('menu-open');
});
            

const menuLinks = document.querySelectorAll('.li-list a');
menuLinks.forEach(link => {
link.addEventListener('click', function() {
menu.classList.remove('active');
burger.classList.remove('active');
body.classList.remove('menu-open');
});
});
            
document.addEventListener('click', function(event) {
const isClickInsideMenu = menu.contains(event.target);
const isClickOnBurger = burger.contains(event.target);
                
if (!isClickInsideMenu && !isClickOnBurger && menu.classList.contains('active')) {
menu.classList.remove('active');
burger.classList.remove('active');
body.classList.remove('menu-open');}
});
}
});
</script>
